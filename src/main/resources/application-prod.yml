app:
  auth:
    # 운영은 HTTPS다. 환경변수를 빠뜨려도 켜지도록 여기서 못 박는다
    cookie-secure: true

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

server:
  forward-headers-strategy: framework