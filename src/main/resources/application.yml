server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: backend_catcheat
  # .env 파일을 properties 형식으로 읽어 ${...} 참조에 주입한다.
  # optional: 파일이 없어도 기동 실패하지 않음(운영 등에서는 환경변수로 대체).
  config:
    import: optional:file:.env[.properties]

  profiles:
    active: dev

  jpa:
    open-in-view: false

  flyway:
    enabled: true

  # DB(datasource)는 application-dev.yml / application-prod.yml에서 프로파일별로 정의한다.

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 55MB

  ai:
    openai:
      # base-url은 지정하지 않는다 — Spring AI 기본값(https://api.openai.com)을 그대로 쓴다
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          # 비전 + Structured Outputs(json_schema strict)를 모두 지원하는 최저가 모델
          model: ${OPENAI_VISION_MODEL:gpt-4o-mini}
          temperature: 0.2
      embedding:
        enabled: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: [profile, email]
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-authentication-method: client_secret_post
            client-name: Kakao
            scope: [profile_nickname, profile_image, account_email]
          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Naver
            scope: [name, email, profile_image]
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

# JWT 설정 — 만료 시간은 임시값(팀 확정 시 갱신). access 30분 / refresh 14일
jwt:
  secret: ${JWT_SECRET}
  access-token-expire-ms: ${JWT_ACCESS_EXPIRE_MS:1800000}
  refresh-token-expire-ms: ${JWT_REFRESH_EXPIRE_MS:1209600000}

# 로그인 성공 후 프론트로 리다이렉트할 기준 주소 (토큰 전달용)
# 운영에서 OAUTH2_REDIRECT_URI를 빠뜨리면 로그인 콜백이 이 기본값(로컬)으로 나간다
app:
  oauth2:
    authorized-redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:3000/oauth/callback}
  auth:
    # 인증 쿠키에 Secure를 붙일지. 로컬은 http라 false, 운영은 application-prod.yml에서 true
    cookie-secure: ${AUTH_COOKIE_SECURE:false}

catcheat:
  vision:
    # 기획안 "1~5장"과 일치
    max-images: 5
    # 한 상 사진으로 동시에 등록할 수 있는 음식 수
    max-food-names: 5
    # 512를 넘기면 타일이 1개에서 4개로 뛰어 토큰이 3배가 된다. 768로 올려도 절감은 0이다
    max-long-edge-px: 512
    jpeg-quality: 0.8
    # 요청 크기 상한용. 토큰 비용은 전송량이 아니라 타일 수로 결정된다
    max-encoded-bytes: 3500000
    # reasoning_effort는 o-시리즈/gpt-5 계열 전용이라 gpt-4o-mini에 보내면 400이 난다.
    # 빈 값이면 요청에 아예 싣지 않는다 — 추론 모델로 갈아탈 때를 위해 설정 자체는 남겨 둔다.
    reasoning-effort: ""

  place:
    # 카카오 로컬 API는 카카오 로그인과 같은 앱의 REST 키를 쓴다.
    # 별도 키로 갈아끼울 수 있게 전용 변수를 먼저 본다.
    api-key: ${KAKAO_REST_API_KEY:${KAKAO_CLIENT_ID}}
    # 카카오 키워드 검색의 size 상한이 15다
    size: 15
    min-query-length: 2
    timeout-ms: 3000


cloud:
  aws:
    s3:
      bucket: ${AWS_S3_BUCKET}
      region: ${AWS_REGION}
      access-key-id: ${AWS_ACCESS_KEY_ID:}
      secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
      session-token: ${AWS_SESSION_TOKEN:}


