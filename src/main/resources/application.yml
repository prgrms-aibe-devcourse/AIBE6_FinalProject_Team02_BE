server:
  port: ${SERVER_PORT:8080}
  tomcat:
    mbeanregistry:
      # 켜야 tomcat_threads_busy_threads 같은 스레드풀 메트릭이 나온다.
      # 스레드 고갈은 부하테스트에서 가장 흔한 병목이라 이게 없으면 진단이 반쪽이 된다
      enabled: true

# 모니터링 (Actuator + Micrometer → Prometheus)
# Prometheus가 15초/5초마다 긁어갈 메트릭을 내주는 설정
management:
  server:
    # 서비스 포트(8080)와 분리한다.
    # nginx는 8080만 프록시하므로 이 포트는 인터넷에서 도달할 수 없다 — nginx 설정을 안 건드려도 안전
    port: ${MANAGEMENT_PORT:9091}
  endpoints:
    web:
      exposure:
        # 필요한 둘만 연다. "*"로 열면 /actuator/env·configprops·heapdump가 같이 열리고
        # 거기엔 DB 비밀번호·JWT 시크릿·OAuth client-secret·AWS 키가 그대로 담긴다
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      # 모든 메트릭에 붙는 공통 라벨 — 나중에 서버가 여러 대가 되면 구분에 쓴다
      application: ${spring.application.name}
    distribution:
      # 켜야 Prometheus로 *_bucket 시리즈가 나가고 histogram_quantile로 p95를 계산할 수 있다.
      # 끄면 평균·최대만 나와서 백분위수를 못 본다
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,200ms,300ms,500ms,1s,2s,5s

spring:
  application:
    name: backend_catcheat
  # .env 파일을 properties 형식으로 읽어 ${...} 참조에 주입한다.
  # optional: 파일이 없어도 기동 실패하지 않음(운영 등에서는 환경변수로 대체).
  config:
    import: optional:file:.env[.properties]

  profiles:
    active: dev

  jpa:
    open-in-view: false

  flyway:
    enabled: true

  # DB(datasource)는 application-dev.yml / application-prod.yml에서 프로파일별로 정의한다.

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 55MB

  ai:
    openai:
      # base-url은 지정하지 않는다 — Spring AI 기본값(https://api.openai.com)을 그대로 쓴다
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          # 비전 + Structured Outputs(json_schema strict)를 모두 지원하는 최저가 모델
          model: ${OPENAI_VISION_MODEL:gpt-4o-mini}
          temperature: 0.2
      embedding:
        enabled: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: [profile, email]
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-authentication-method: client_secret_post
            client-name: Kakao
            scope: [profile_nickname, profile_image, account_email]
          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Naver
            scope: [name, email, profile_image]
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

# JWT 설정 — 만료 시간은 임시값(팀 확정 시 갱신). access 30분 / refresh 14일
jwt:
  secret: ${JWT_SECRET}
  access-token-expire-ms: ${JWT_ACCESS_EXPIRE_MS:1800000}
  refresh-token-expire-ms: ${JWT_REFRESH_EXPIRE_MS:1209600000}

# API 문서 (springdoc 3.x = Spring Boot 4 계열)
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:true}
    # 정렬을 고정해 새 API가 끼어들어도 문서 순서가 흔들리지 않게 한다
    tags-sorter: alpha
    operations-sorter: method
    # 스키마 섹션은 접어 둔다 — DTO가 많아 펼쳐두면 화면이 그것만 남는다
    doc-expansion: none
    csrf:
      # XSRF-TOKEN 쿠키를 읽어 X-XSRF-TOKEN 헤더로 되돌려보낸다.
      # 켜지 않으면 Try it out의 POST·PATCH·DELETE가 전부 403이 된다
      enabled: true

# 로그인 성공 후 프론트로 리다이렉트할 기준 주소 (토큰 전달용)
# 운영에서 OAUTH2_REDIRECT_URI를 빠뜨리면 로그인 콜백이 이 기본값(로컬)으로 나간다
app:
  oauth2:
    authorized-redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:3000/oauth/callback}
  auth:
    # 인증 쿠키에 Secure를 붙일지. 로컬은 http라 false, 운영은 application-prod.yml에서 true
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
    test-login:
      enabled: ${TEST_LOGIN_ENABLED:false}   # 운영 false, 심사 배포에서만 true
      secret: ${TEST_LOGIN_SECRET:}          # 비워두면 시크릿 검사 없음(버튼 원클릭용)

catcheat:
  vision:
    # 기획안 "1~5장"과 일치
    max-images: 5
    # 한 상 사진으로 동시에 등록할 수 있는 음식 수
    max-food-names: 5
    # 512를 넘기면 타일이 1개에서 4개로 뛰어 토큰이 3배가 된다. 768로 올려도 절감은 0이다
    max-long-edge-px: 512
    jpeg-quality: 0.8
    # 요청 크기 상한용. 토큰 비용은 전송량이 아니라 타일 수로 결정된다
    max-encoded-bytes: 3500000
    # reasoning_effort는 o-시리즈/gpt-5 계열 전용이라 gpt-4o-mini에 보내면 400이 난다.
    # 빈 값이면 요청에 아예 싣지 않는다 — 추론 모델로 갈아탈 때를 위해 설정 자체는 남겨 둔다.
    reasoning-effort: ""

  heic:
    # 이미지 안의 절대 경로. PATH를 타면 컨테이너 밖에서 다른 바이너리가 잡힐 수 있다
    binary-path: /usr/bin/heif-convert
    # 변환 결과는 곧바로 축소·재인코딩되므로 원본 품질을 높게 유지할 이유가 없다
    quality: 90
    # 12MP 아이폰 원본이 1~2초. 그보다 오래 걸리면 정상 경로가 아니다
    timeout-ms: 10000

  place:
    # 카카오 로컬 API는 카카오 로그인과 같은 앱의 REST 키를 쓴다.
    # 별도 키로 갈아끼울 수 있게 전용 변수를 먼저 본다.
    api-key: ${KAKAO_REST_API_KEY:${KAKAO_CLIENT_ID}}
    # 카카오 키워드 검색의 size 상한이 15다
    size: 15
    min-query-length: 2
    timeout-ms: 3000

  illustration:
    # 이미지 생성만 Spring AI가 아니라 RestClient로 직접 부른다.
    # /v1/images/edits(i2i)를 감싼 추상화가 없고, background·output_format도 실을 수 없다.
    api-key: ${OPENAI_API_KEY:}
    # 스파이크에서 확정. 상위 모델과 품질 차이가 크지 않은데 비용은 1/4이다
    model: ${OPENAI_IMAGE_MODEL:gpt-image-1-mini}
    # low는 크레파스 질감이 뭉개지고 high는 비용만 오른다
    quality: medium
    # 이 값이 없으면 12MP 스마트폰 원본이 "Invalid image file or mode"로 거절된다.
    # 스파이크 테스트 사진 34장 중 8장이 4032x3024였다
    source-max-edge-px: 1024
    # 이미지 API가 받는 크기여야 한다
    result-size-px: 1024
    # 표시 최대가 240px이라 512면 레티나까지 충분하다. 1024 원본은 2.4MB로 너무 크다
    stored-max-edge-px: 512
    # 건당 약 $0.0115. 20회면 유저당 하루 최대 $0.23이다
    daily-limit: 20
    # 평균 17초, 길면 25초 걸린다
    timeout-ms: 60000


cloud:
  aws:
    s3:
      bucket: ${AWS_S3_BUCKET}
      region: ${AWS_REGION}
      access-key-id: ${AWS_ACCESS_KEY_ID:}
      secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
      session-token: ${AWS_SESSION_TOKEN:}


