name: Build and Deploy dev

on:
  push:
    branches:
      - develop

# id-token: write는 OIDC(AssumeRoleWithWebIdentity)에만 필요하다.
# 이 계정은 SCP/RCP로 보이는 정책이 외부 Federated 인증을 막아서 Access Key 방식을 쓴다.
permissions:
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: catcheat-prod-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY는 GitHub 리포지토리 Secrets에 등록된 값이다.
      # 이 계정은 iam:CreateUser/CreateAccessKey가 identity 정책에서 막혀있어 전용 CI 사용자를
      # 만들지 못했고, 기존 계정 사용자(devcos-team02)의 Access Key를 그대로 쓰고 있다.
      # devcos-team02는 AdministratorAccess라 이 Secret이 노출되면 계정 전체가 위험하다 -
      # 계정 관리자가 전용 최소권한 CI 사용자를 만들어줄 수 있을 때 교체해야 한다.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:develop .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:develop
          
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/catcheat/backend
            git pull upstream develop
            aws ecr get-login-password --region ap-northeast-2 | docker login --username AWS --password-stdin 495264909330.dkr.ecr.ap-northeast-2.amazonaws.com
            docker compose -f docker-compose.dev.yml --project-name catcheat-dev --env-file .env.dev pull
            docker compose -f docker-compose.dev.yml --project-name catcheat-dev --env-file .env.dev up -d