# 부하테스트용 관측 스택 — Prometheus + Grafana
#
#   docker compose -f monitoring/docker-compose.monitoring.yml up -d
#
# 기존 docker-compose.yml(postgres·redis)과 **파일을 분리**했다.
# 평소 개발할 때 이 두 컨테이너까지 띄울 이유가 없고, 실수로 기존 파일을 건드릴 위험도 없앤다.
#
# 포트
#   9090 Prometheus  — 수집·저장. 브라우저로 직접 열어 PromQL을 시험할 수 있다
#   3001 Grafana     — 화면. FE가 3000을 쓰므로 3001로 비켜 둔다

name: catcheat-monitoring

services:
    prometheus:
        image: prom/prometheus:v3.1.0
        container_name: catcheat-prometheus
        restart: unless-stopped
        command:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            # 부하테스트 기록을 나중에 비교하려면 넉넉히 남긴다
            - --storage.tsdb.retention.time=15d
            # ★ k6가 결과를 밀어 넣는(remote write) 창구를 연다.
            #   k6는 몇 분 돌고 사라져서 Prometheus가 긁으러 갈 수가 없다 —
            #   pull 모델의 예외이고, 이 플래그가 없으면 k6 -o 옵션이 404로 실패한다
            - --web.enable-remote-write-receiver
        ports:
            - '9090:9090'
        volumes:
            - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
            - prometheus_data:/prometheus
        extra_hosts:
            # Windows/Mac 도커는 host.docker.internal을 알아서 주지만 리눅스는 아니다.
            # 이 한 줄이 없으면 리눅스 팀원 환경에서만 수집이 안 된다
            - 'host.docker.internal:host-gateway'

    grafana:
        image: grafana/grafana:11.5.2
        container_name: catcheat-grafana
        restart: unless-stopped
        depends_on:
            - prometheus
        ports:
            - '3001:3000'
        environment:
            GF_SECURITY_ADMIN_USER: admin
            GF_SECURITY_ADMIN_PASSWORD: admin
            GF_USERS_ALLOW_SIGN_UP: 'false'
            # 로그인 없이 바로 보게 한다. 로컬 전용이라 괜찮고, 팀원 온보딩이 훨씬 쉬워진다.
            # ⚠️ 배포 서버로 옮길 때는 이 두 줄을 반드시 지운다
            GF_AUTH_ANONYMOUS_ENABLED: 'true'
            GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
        volumes:
            # 데이터소스·대시보드를 파일로 미리 넣어 둔다(provisioning).
            # 손으로 클릭해 등록하면 팀원마다 환경이 달라진다
            - ./grafana/provisioning:/etc/grafana/provisioning:ro
            - grafana_data:/var/lib/grafana

volumes:
    prometheus_data:
    grafana_data:
