# Grafana 데이터소스 자동 등록.
# 이 파일이 있으면 컨테이너가 뜰 때 Prometheus가 이미 연결된 상태로 시작한다 — 클릭 설정 불필요.
apiVersion: 1

datasources:
    - name: Prometheus
      type: prometheus
      # uid를 고정한다. 자동 생성에 맡기면 환경마다 값이 달라져
      # 대시보드 JSON이 "데이터소스를 찾을 수 없음"으로 깨진다
      uid: catcheat-prometheus
      access: proxy
      # 같은 도커 네트워크 안이라 서비스 이름으로 부른다. localhost가 아니다 —
      # Grafana 컨테이너의 localhost는 Grafana 자신이다
      url: http://prometheus:9090
      isDefault: true
      editable: false
      jsonData:
          # prometheus.yml의 scrape_interval과 맞춘다. 안 맞추면 Grafana가
          # 존재하지 않는 해상도로 질의해 그래프에 구멍이 생긴다
          timeInterval: 5s
